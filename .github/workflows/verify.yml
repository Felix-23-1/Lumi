# Baut Lumi und führt alle Prüfungen aus (mac/scripts/verify.sh) – auf einem GitHub-Mac mit Xcode.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Version
        run: xcodebuild -version
      - name: Swift-Version
        run: swift --version
      - name: Bauen und prüfen
        working-directory: mac
        run: ./scripts/verify.sh
