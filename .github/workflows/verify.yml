# Baut Lumi und führt alle Prüfungen aus (mac/scripts/verify.sh) – auf einem GitHub-Mac mit Xcode.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Neuestes Xcode wählen
        run: |
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Nutze $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          xcrun --show-sdk-version
          swift --version
      - name: Bauen und prüfen
        working-directory: mac
        run: ./scripts/verify.sh
