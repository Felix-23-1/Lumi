# Baut Lumi und führt alle Prüfungen aus (siehe mac/scripts/verify.sh) – auf einem GitHub-Mac mit Xcode.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Neuestes Xcode wählen
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Nutze $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Bauen
        working-directory: mac
        run: |
          set +e
          swift build > ../build.log 2>&1
          code=$?
          echo "swift build Exit-Code: $code"
          echo "=== FEHLER (ohne Wiederholungen) ==="
          grep -E 'error:' ../build.log | sed 's#/Users/runner/work/Lumi/Lumi/##' | sort -u | head -80
          exit $code
      - name: Prüfungen
        working-directory: mac
        run: |
          set +e
          swift run TabyChecks > ../checks.log 2>&1
          code=$?
          echo "TabyChecks Exit-Code: $code"
          echo "=== letzte 60 Zeilen ==="
          tail -60 ../checks.log
          exit $code
      - name: Protokolle sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            checks.log
